# Gradle / build infra
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Target stack. neoforge.mods.toml refers to these by name through
# generateModMetadata, so removing one breaks the build rather than the mod.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.227
loader_version_range=[1,)

# Mod identity
mod_id=arswarptomap
mod_name=Ars Warp to Map
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.kuronami.arswarptomap
mod_authors=KURONAMI
mod_description=Shows the destinations of your Ars Nouveau warp scrolls as JourneyMap waypoints.

# ─── Dependencies ─────────────────────────────────────────────
# JourneyMap API (compileOnly・TeamJM 公式 maven)
jmap_api_version=2.0.0-1.21.1-SNAPSHOT
# Ars Nouveau (compileOnly・Modrinth maven。Modrinth project ars-nouveau / CF 401955)
arsnouveau_version=5.13.3
# runClient 用 localRuntime (Modrinth maven・1.21.1 neoforge)
jm_version=1.21.1-6.0.5+neoforge
